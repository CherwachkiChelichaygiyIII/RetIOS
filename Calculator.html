<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Калькулятор">

    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='26' fill='%231a1a1a'/><rect x='12' y='12' width='96' height='96' rx='18' fill='url(%23grad)' stroke='%23000' stroke-width='2'/><defs><linearGradient id='grad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='%23737373'/><stop offset='100%' stop-color='%234d4d4d'/></linearGradient></defs><rect x='22' y='22' width='76' height='22' rx='4' fill='%23849387' stroke='%2348544a'/><rect x='22' y='52' width='16' height='14' rx='3' fill='%23ff9f1c'/><rect x='44' y='52' width='16' height='14' rx='3' fill='%234c4c4c'/><rect x='66' y='52' width='16' height='14' rx='3' fill='%234c4c4c'/><rect x='22' y='72' width='16' height='14' rx='3' fill='%234c4c4c'/><rect x='44' y='72' width='16' height='14' rx='3' fill='%234c4c4c'/><rect x='66' y='72' width='16' height='14' rx='3' fill='%23ff9f1c'/></svg>">

    <title>Calculator iOS 6</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: #111;
            background-image: radial-gradient(circle, #222 10%, #050505 90%);
            height: 100vh;
            width: 100vw;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        }

        .scaler-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        .calculator {
            background: linear-gradient(to bottom, #2b2b2b, #121212);
            border-radius: 26px;
            padding: 26px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 2px solid #000;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
        }

        .display {
            background: #849387;
            height: 90px;
            border-radius: 6px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0 22px 14px 22px;
            font-size: 54px;
            color: #111;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 2px solid #48544a;
            overflow: hidden;
            white-space: nowrap;
        }

        .display span {
            display: inline-block;
            transform-origin: right bottom;
        }

        .keypad {
            display: grid;
            gap: 14px;
        }

        .calculator.portrait {
            width: 460px;
        }
        .calculator.portrait .keypad {
            grid-template-columns: repeat(4, 1fr);
        }

        .calculator.landscape {
            width: 820px;
        }
        .calculator.landscape .keypad {
            grid-template-columns: repeat(8, 1fr);
        }

        button {
            height: 64px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.8);
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.5), inset 0 -3px 4px rgba(0, 0, 0, 0.4), 0 3px 5px rgba(0, 0, 0, 0.5);
        }

        button:active {
            filter: brightness(0.75);
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8), 0 1px 2px rgba(0, 0, 0, 0.3);
            transform: translateY(1px);
        }

        .btn-light-gray {
            background: linear-gradient(to bottom, #d6d6d6, #9e9e9e);
            color: #1a1a1a;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .btn-dark-gray {
            background: linear-gradient(to bottom, #4c4c4c, #2a2a2a);
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
        }

        .btn-orange {
            background: linear-gradient(to bottom, #ff9f1c, #d65a00);
            color: #ffffff;
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.6);
            border-color: #8c3800;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0 -3px 4px rgba(120, 30, 0, 0.6), 0 3px 5px rgba(0, 0, 0, 0.5);
        }

        .btn-scientific {
            background: linear-gradient(to bottom, #3d4955, #1b222a);
            color: #ffffff;
            font-size: 18px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.9);
            border-color: #0d1115;
        }

        .portrait .btn-zero {
            grid-column: span 2;
        }
        
        .landscape .btn-zero {
            grid-column: span 1;
        }
    </style>
</head>
<body>

    <div class="scaler-wrapper" id="scalerWrapper">
        <div class="calculator portrait" id="calcContainer">
            <div class="display"><span id="displaySpan">0</span></div>
            <div class="keypad" id="keypad"></div>
        </div>
    </div>

    <script>
        let displaySpan = document.getElementById('displaySpan');
        let calcContainer = document.getElementById('calcContainer');
        let keypad = document.getElementById('keypad');
        
        let expression = '0';
        let evaluated = false;

        function updateDisplay() {
            displaySpan.innerText = expression;
            let length = expression.length;
            if (length > 9) {
                let scale = 9 / length;
                displaySpan.style.transform = `scale(${Math.max(scale, 0.35)})`;
            } else {
                displaySpan.style.transform = 'scale(1)';
            }
        }

        function autoScale() {
            let isLandscape = window.innerWidth > window.innerHeight;
            let targetWidth = isLandscape ? 860 : 510;
            let targetHeight = isLandscape ? 500 : 750;

            let scaleX = (window.innerWidth - 20) / targetWidth;
            let scaleY = (window.innerHeight - 20) / targetHeight;
            let scale = Math.min(scaleX, scaleY, 1);

            calcContainer.style.transform = `scale(${scale})`;
        }

        function updateLayout() {
            let isLandscape = window.innerWidth > window.innerHeight;
            
            if (isLandscape) {
                calcContainer.className = "calculator landscape";
                keypad.innerHTML = `
                    <button class="btn-scientific" onclick="applyUnary('sin')">sin</button>
                    <button class="btn-scientific" onclick="applyUnary('cos')">cos</button>
                    <button class="btn-scientific" onclick="applyUnary('tan')">tan</button>
                    <button class="btn-scientific" onclick="appendValue('(')">(</button>
                    <button class="btn-scientific" onclick="appendValue(')')">)</button>
                    <button class="btn-light-gray" onclick="clearDisplay()">AC</button>
                    <button class="btn-light-gray" onclick="toggleSign()">+/-</button>
                    <button class="btn-orange" onclick="appendValue('/')">÷</button>

                    <button class="btn-scientific" onclick="applyUnary('asin')">asin</button>
                    <button class="btn-scientific" onclick="applyUnary('acos')">acos</button>
                    <button class="btn-scientific" onclick="applyUnary('atan')">atan</button>
                    <button class="btn-dark-gray" onclick="appendValue('7')">7</button>
                    <button class="btn-dark-gray" onclick="appendValue('8')">8</button>
                    <button class="btn-dark-gray" onclick="appendValue('9')">9</button>
                    <button class="btn-scientific" onclick="appendValue('/100')">%</button>
                    <button class="btn-orange" onclick="appendValue('*')">×</button>

                    <button class="btn-scientific" onclick="applyUnary('log')">log</button>
                    <button class="btn-scientific" onclick="applyUnary('ln')">ln</button>
                    <button class="btn-scientific" onclick="applyUnary('sqrt')">√</button>
                    <button class="btn-dark-gray" onclick="appendValue('4')">4</button>
                    <button class="btn-dark-gray" onclick="appendValue('5')">5</button>
                    <button class="btn-dark-gray" onclick="appendValue('6')">6</button>
                    <button class="btn-scientific" onclick="applyUnary('sqr')">x²</button>
                    <button class="btn-orange" onclick="appendValue('-')">-</button>

                    <button class="btn-scientific" onclick="appendConst(Math.PI)">π</button>
                    <button class="btn-scientific" onclick="appendConst(Math.E)">e</button>
                    <button class="btn-scientific" onclick="applyUnary('inv')">1/x</button>
                    <button class="btn-dark-gray" onclick="appendValue('1')">1</button>
                    <button class="btn-dark-gray" onclick="appendValue('2')">2</button>
                    <button class="btn-dark-gray" onclick="appendValue('3')">3</button>
                    <button class="btn-scientific" onclick="factorialFunc()">n!</button>
                    <button class="btn-orange" onclick="appendValue('+')">+</button>

                    <button class="btn-scientific" style="grid-column: span 3;" onclick="appendRand()">Rand</button>
                    <button class="btn-dark-gray btn-zero" onclick="appendValue('0')">0</button>
                    <button class="btn-dark-gray" onclick="appendValue('.')">.</button>
                    <button class="btn-orange" onclick="calculate()">=</button>
                `;
            } else {
                calcContainer.className = "calculator portrait";
                keypad.innerHTML = `
                    <button class="btn-light-gray" onclick="clearDisplay()">AC</button>
                    <button class="btn-light-gray" onclick="toggleSign()">+/-</button>
                    <button class="btn-light-gray" onclick="appendValue('/100')">%</button>
                    <button class="btn-orange" onclick="appendValue('/')">÷</button>

                    <button class="btn-dark-gray" onclick="appendValue('7')">7</button>
                    <button class="btn-dark-gray" onclick="appendValue('8')">8</button>
                    <button class="btn-dark-gray" onclick="appendValue('9')">9</button>
                    <button class="btn-orange" onclick="appendValue('*')">×</button>

                    <button class="btn-dark-gray" onclick="appendValue('4')">4</button>
                    <button class="btn-dark-gray" onclick="appendValue('5')">5</button>
                    <button class="btn-dark-gray" onclick="appendValue('6')">6</button>
                    <button class="btn-orange" onclick="appendValue('-')">-</button>

                    <button class="btn-dark-gray" onclick="appendValue('1')">1</button>
                    <button class="btn-dark-gray" onclick="appendValue('2')">2</button>
                    <button class="btn-dark-gray" onclick="appendValue('3')">3</button>
                    <button class="btn-orange" onclick="appendValue('+')">+</button>

                    <button class="btn-dark-gray btn-zero" onclick="appendValue('0')">0</button>
                    <button class="btn-dark-gray" onclick="appendValue('.')">.</button>
                    <button class="btn-orange" onclick="calculate()">=</button>
                `;
            }
            autoScale();
        }

        window.addEventListener('resize', () => { updateLayout(); autoScale(); });
        window.addEventListener('orientationchange', () => { updateLayout(); autoScale(); });
        window.addEventListener('DOMContentLoaded', () => { updateLayout(); autoScale(); });

        function appendValue(val) {
            if (evaluated) {
                if (!isNaN(val) || val === '(') {
                    expression = val;
                } else {
                    expression += val;
                }
                evaluated = false;
            } else {
                if (expression === '0' && val !== '.' && !isNaN(val)) {
                    expression = val;
                } else {
                    if (expression.length < 25) {
                        expression += val;
                    }
                }
            }
            updateDisplay();
        }

        function applyUnary(func) {
            try {
                let val = eval(expression);
                let res = val;
                switch(func) {
                    case 'sin': res = Math.sin(val); break;
                    case 'cos': res = Math.cos(val); break;
                    case 'tan': res = Math.tan(val); break;
                    case 'asin': res = Math.asin(val); break;
                    case 'acos': res = Math.acos(val); break;
                    case 'atan': res = Math.atan(val); break;
                    case 'log': res = Math.log10(val); break;
                    case 'ln': res = Math.log(val); break;
                    case 'sqrt': res = Math.sqrt(val); break;
                    case 'sqr': res = val * val; break;
                    case 'inv': res = 1 / val; break;
                }
                if (!isFinite(res)) {
                    expression = 'Ошибка';
                } else {
                    expression = parseFloat(res.toFixed(10)).toString();
                }
                evaluated = true;
                updateDisplay();
            } catch (e) {
                expression = 'Ошибка';
                evaluated = true;
                updateDisplay();
            }
        }

        function appendConst(val) {
            let strVal = parseFloat(val.toFixed(6)).toString();
            if (expression === '0' || evaluated) {
                expression = strVal;
            } else {
                expression += strVal;
            }
            evaluated = false;
            updateDisplay();
        }

        function appendRand() {
            let randVal = Math.random().toFixed(4);
            if (evaluated || expression === '0') {
                expression = randVal;
            } else {
                expression += randVal;
            }
            evaluated = false;
            updateDisplay();
        }

        function clearDisplay() {
            expression = '0';
            evaluated = false;
            updateDisplay();
        }

        function calculate() {
            try {
                let cleanExpr = expression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                let result = eval(cleanExpr);
                
                if (!isFinite(result)) {
                    expression = 'Ошибка';
                } else {
                    expression = parseFloat(result.toFixed(10)).toString();
                }
                evaluated = true;
            } catch (e) {
                expression = 'Ошибка';
                evaluated = true;
            }
            updateDisplay();
        }

        function toggleSign() {
            try {
                let result = eval(expression) * -1;
                expression = result.toString();
                updateDisplay();
            } catch (e) {}
        }

        function factorialFunc() {
            try {
                let n = parseInt(eval(expression));
                let res = 1;
                for(let i = 2; i <= n; i++) res *= i;
                expression = res.toString();
                evaluated = true;
                updateDisplay();
            } catch(e) {}
        }
    </script>
</body>
</html>
