<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> IRacer</title>
    
    <!-- Скеоморфная иконка для рабочего стола iOS (добавление на экран Домой) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23333333'/%3E%3Cstop offset='100%25' stop-color='%23111111'/%3E%3C/linearGradient%3E%3ClinearGradient id='car' x1='0%25' y1='0%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23b7094c'/%3E%3Cstop offset='100%25' stop-color='%23d90429'/%3E%3C/linearGradient%3E%3ClinearGradient id='glass' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='rgba(255,255,255,0.4)'/%3E%3Cstop offset='50%25' stop-color='rgba(255,255,255,0.0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23bg)' stroke='%23000' stroke-width='4'/%3E%3Cpath d='M70 30L90 10L110 30V150H70Z' fill='%23222'/%3E%3Crect x='76' y='20' width='28' height='120' fill='%232b2b2b'/%3E%3Crect x='88' y='20' width='4' height='120' fill='%23e9c46a' stroke='%23111' stroke-dasharray='12 12'/%3E%3Crect x='78' y='70' width='24' height='45' rx='6' fill='url(%23car)' stroke='%23000' stroke-width='2'/%3E%3Crect x='82' y='80' width='16' height='10' fill='%23111'/%3E%3Crect x='82' y='100' width='16' height='6' fill='%23111'/%3E%3Crect x='72' y='78' width='4' height='10' fill='%23050505'/%3E%3Crect x='104' y='78' width='4' height='10' fill='%23050505'/%3E%3Crect x='72' y='102' width='4' height='10' fill='%23050505'/%3E%3Crect x='104' y='102' width='4' height='10' fill='%23050505'/%3E%3Crect x='0' y='0' width='180' height='90' fill='url(%23glass)' rx='40'/%3E%3C/svg%3E">

    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Helvetica, Arial, sans-serif;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 460px;
            background: #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 3px solid #111;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2);
        }

        .dashboard-header {
            background: linear-gradient(to bottom, #555555 0%, #333333 50%, #222222 51%, #111111 100%);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 -1px 0 #000;
            z-index: 5;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .dashboard-screen {
            background: linear-gradient(to bottom, #6b7a6e, #849387);
            border: 1px solid #333;
            border-top: 1px solid #222;
            padding: 3px 8px;
            border-radius: 4px;
            color: #111;
            font-family: monospace;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.2);
            text-shadow: 0 1px 0 rgba(255,255,255,0.2);
        }

        .sound-toggle-btn {
            background: linear-gradient(to bottom, #666 0%, #444 50%, #333 51%, #222 100%);
            border: 1px solid #111;
            color: #fff;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.5);
            text-shadow: 0 -1px 0 #000;
        }

        .sound-toggle-btn:active {
            background: linear-gradient(to bottom, #222 0%, #333 50%, #444 51%, #555 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #333333 0%, #121212 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .screen-overlay h1 {
            font-size: 32px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(255,159,28,0.4);
        }

        .screen-overlay p {
            font-size: 13px;
            margin-bottom: 15px;
            color: #aaa;
            text-shadow: 0 1px 0 #000;
        }

        .menu-stats {
            background: linear-gradient(to bottom, #1c1c1c, #111111);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 22px;
            margin-bottom: 18px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 2px 5px rgba(0,0,0,0.5);
        }

        .menu-stat-item {
            text-align: center;
        }

        .menu-stat-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 3px;
            text-shadow: 0 1px 0 #000;
        }

        .menu-stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #e9c46a;
            font-family: monospace;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .speed-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .speed-btn {
            background: linear-gradient(to bottom, #444, #222);
            color: #aaa;
            border: 1px solid #111;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 4px rgba(0,0,0,0.4);
            text-shadow: 0 -1px 0 #000;
        }

        .speed-btn.active {
            background: linear-gradient(to bottom, #0096c7, #0077b6);
            color: #fff;
            border-color: #003049;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.6);
        }

        .btn {
            background: linear-gradient(to bottom, #ffb703 0%, #fb8500 50%, #d47000 51%, #b25d00 100%);
            color: #ffffff;
            border: 1px solid #6b3500;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.6);
            text-shadow: 0 -1px 0 rgba(0,0,0,0.5);
        }

        .btn:active {
            background: linear-gradient(to bottom, #b25d00 0%, #d47000 50%, #fb8500 51%, #ffb703 100%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .btn-secondary {
            background: linear-gradient(to bottom, #666 0%, #444 50%, #333 51%, #222 100%);
            border-color: #111;
        }

        .controls-hint {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            border-top: 1px dashed #333;
            padding-top: 10px;
            width: 80%;
            text-shadow: 0 1px 0 #000;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="dashboard-header">
            <span>ТЕМП: <span id="speedVal" class="dashboard-screen">140</span></span>
            <button id="soundBtn" class="sound-toggle-btn" onclick="toggleSound()">♫ ВКЛ</button>
            <span>СЧЕТ: <span id="scoreVal" class="dashboard-screen">0</span></span>
        </div>

        <div class="canvas-container">
            <div id="startScreen" class="screen-overlay">
                <h1>IDRIVE</h1>
                <p>Трасса раскалена до предела</p>

                <div class="menu-stats">
                    <div class="menu-stat-item">
                        <div class="menu-stat-label">РЕКОРД</div>
                        <div id="bestScoreVal" class="menu-stat-value">0</div>
                    </div>
                    <div class="menu-stat-item" style="border-left: 1px solid #333; padding-left: 20px;">
                        <div class="menu-stat-label">РЕЖИМ</div>
                        <div class="menu-stat-value" style="color: #48cae4;">CLASSIC</div>
                    </div>
                </div>
                
                <div class="speed-selector">
                    <button class="speed-btn" onclick="setPresetSpeed(1, 100, 110)">Круиз</button>
                    <button class="speed-btn active" onclick="setPresetSpeed(1.5, 140, 90)">Драйв</button>
                    <button class="speed-btn" onclick="setPresetSpeed(2.2, 190, 75)">Хардкор</button>
                </div>

                <button class="btn" onclick="startGame()">ПУСК</button>

                <div class="controls-hint">
                    💡 Левая / правая часть экрана — маневры
                </div>
            </div>

            <div id="gameOverScreen" class="screen-overlay" style="display: none;">
                <h1>АВАРИЯ</h1>
                <p>Дистанция: <span id="finalScore" class="dashboard-screen" style="display:inline-block; margin-top:5px;">0</span></p>
                <button class="btn" onclick="startGame()">ЕЩЕ РАЗ</button>
                <button class="btn btn-secondary" onclick="showMenu()">В МЕНЮ</button>
            </div>

            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 650;

        let gameRunning = false;
        let soundEnabled = true;
        let score = 0;
        let bestScore = localStorage.getItem('highway_best') || 0;
        let roadOffset = 0;
        let spawnCounter = 0;

        document.getElementById('bestScoreVal').innerText = bestScore;

        let gameConfig = {
            speedMultiplier: 1.5,
            displaySpeed: 140,
            spawnRate: 90
        };

        function setPresetSpeed(mult, disp, rate) {
            gameConfig.speedMultiplier = mult;
            gameConfig.displaySpeed = disp;
            gameConfig.spawnRate = rate;
            document.getElementById('speedVal').innerText = disp;

            let btns = document.querySelectorAll('.speed-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        let player = {
            x: 175,
            y: 520,
            width: 45,
            height: 80,
            speed: 6,
            dir: 0 
        };

        let enemies = [];

        let audioCtx = null;
        let audioTimerId = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            let btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '♫ ВКЛ' : '— ВЫКЛ';
            if (!soundEnabled) {
                stopMusic();
            } else {
                if (gameRunning) {
                    startGameMusic();
                } else {
                    startMenuMusic();
                }
            }
        }

        function startMenuMusic() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            stopMusic();

            let menuChords = [110, 146.83, 164.81, 220];
            let step = 0;

            audioTimerId = setInterval(() => {
                if (!soundEnabled || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = menuChords[step % menuChords.length];

                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                    step++;
                } catch(e) {}
            }, 500);
        }

        function startGameMusic() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            stopMusic();

            let gameMelody = [130.81, 164.81, 196.00, 246.94];
            let step = 0;
            let intervalTime = Math.max(120, 180 / gameConfig.speedMultiplier);

            audioTimerId = setInterval(() => {
                if (!gameRunning || !soundEnabled || !audioCtx) return;
                try {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = gameMelody[step % gameMelody.length];

                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    step++;
                } catch(e) {}
            }, intervalTime);
        }

        function stopMusic() {
            if (audioTimerId) {
                clearInterval(audioTimerId);
                audioTimerId = null;
            }
        }

        window.addEventListener('pointerdown', () => {
            if (!audioTimerId && !gameRunning && soundEnabled) {
                startMenuMusic();
            }
        }, { once: true });

        canvas.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            let rect = canvas.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            let canvasMiddle = rect.width / 2;
            player.dir = touchX < canvasMiddle ? -1 : 1;
            e.preventDefault();
        }, false);

        canvas.addEventListener('touchend', (e) => {
            player.dir = 0;
            e.preventDefault();
        }, false);

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            player.x = canvas.width / 2 - 22;
            player.y = canvas.height - 120;

            enemies = [];
            score = 0;
            spawnCounter = 0;
            gameRunning = true;
            startGameMusic();
            requestAnimationFrame(loop);
        }

        function showMenu() {
            document.getElementById('bestScoreVal').innerText = bestScore;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
            startMenuMusic();
        }

        function gameOver() {
            gameRunning = false;
            stopMusic();
            let finalDist = Math.floor(score);
            
            if (finalDist > bestScore) {
                bestScore = finalDist;
                localStorage.setItem('highway_best', bestScore);
            }

            document.getElementById('finalScore').innerText = finalDist;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function update() {
            player.x += player.dir * player.speed;
            let roadMargin = 30;
            if (player.x < roadMargin) player.x = roadMargin;
            if (player.x > canvas.width - roadMargin - player.width) player.x = canvas.width - roadMargin - player.width;

            roadOffset = (roadOffset + (4 * gameConfig.speedMultiplier)) % 80;

            spawnCounter++;
            if (spawnCounter > gameConfig.spawnRate) {
                spawnCounter = 0;
                let roadWidth = canvas.width - 60;
                let enemyX = roadMargin + Math.random() * (roadWidth - 45);
                let enemySpeed = (3.5 + Math.random() * 1.5) * (gameConfig.speedMultiplier * 0.8);
                enemies.push({ x: enemyX, y: -100, width: 45, height: 80, speed: enemySpeed, color: Math.random() > 0.5 ? '#0077b6' : '#2a9d8f' });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                if (
                    player.x < enemies[i].x + enemies[i].width - 6 &&
                    player.x + player.width > enemies[i].x + 6 &&
                    player.y < enemies[i].y + enemies[i].height - 6 &&
                    player.y + player.height > enemies[i].y + 6
                ) {
                    gameOver();
                }

                if (enemies[i].y > canvas.height) {
                    enemies.splice(i, 1);
                    score += Math.floor(20 * gameConfig.speedMultiplier);
                }
            }

            document.getElementById('scoreVal').innerText = Math.floor(score);
        }

        function drawCar(x, y, w, h, mainColor, isPlayer) {
            ctx.fillStyle = mainColor;
            ctx.fillRect(x + 4, y + 8, w - 8, h - 16);
            ctx.fillRect(x, y + 16, w, h - 32);

            ctx.fillStyle = isPlayer ? '#b7094c' : '#1d3557';
            ctx.fillRect(x + 6, y + 26, w - 12, h - 48);

            ctx.fillStyle = '#111';
            if (isPlayer) {
                ctx.fillRect(x + 8, y + 30, w - 16, 12);
                ctx.fillRect(x + 8, y + 54, w - 16, 8);
            } else {
                ctx.fillRect(x + 8, y + 54, w - 16, 12);
                ctx.fillRect(x + 8, y + 30, w - 16, 8);
            }

            if (isPlayer) {
                ctx.fillStyle = '#ff0054';
                ctx.fillRect(x + 2, y + h - 6, 8, 4);
                ctx.fillRect(x + w - 10, y + h - 6, 8, 4);
            } else {
                ctx.fillStyle = '#ffb703';
                ctx.fillRect(x + 3, y + 2, 8, 4);
                ctx.fillRect(x + w - 11, y + 2, 8, 4);
            }

            ctx.fillStyle = '#050505';
            ctx.fillRect(x - 3, y + 14, 4, 16);
            ctx.fillRect(x + w - 1, y + 14, 4, 16);
            ctx.fillRect(x - 3, y + h - 26, 4, 16);
            ctx.fillRect(x + w - 1, y + h - 26, 4, 16);
        }

        function draw() {
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#2b2b2b';
            ctx.fillRect(30, 0, canvas.width - 60, canvas.height);

            ctx.fillStyle = '#b7094c';
            ctx.fillRect(20, 0, 10, canvas.height);
            ctx.fillRect(canvas.width - 30, 0, 10, canvas.height);

            ctx.fillStyle = '#e9c46a';
            let lineY = roadOffset - 80;
            while (lineY < canvas.height) {
                ctx.fillRect(canvas.width / 2 - 2, lineY, 4, 40);
                lineY += 80;
            }

            drawCar(player.x, player.y, player.width, player.height, '#d90429', true);

            for (let i = 0; i < enemies.length; i++) {
                let en = enemies[i];
                drawCar(en.x, en.y, en.width, en.height, en.color, false);
            }
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
